<!doctype html>
<meta charset="utf-8">
<title>Omarchy Ad Blocker</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1c1c1e; --muted: #6b6b70;
    --line: #e3e3e6; --accent: #2f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --fg: #ececef; --muted: #98989f;
            --line: #2f2f33; --accent: #6f9bff; }
  }
  body { margin: 0; width: 272px; background: var(--bg); color: var(--fg);
         font: 13px/1.45 system-ui, sans-serif; }
  header { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .01em; }
  .host { margin-top: 2px; color: var(--muted); font-size: 12px;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row { display: flex; align-items: center; justify-content: space-between;
         gap: 10px; padding: 9px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row label { flex: 1; cursor: pointer; }
  .sub { display: block; color: var(--muted); font-size: 11px; }
  input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  footer { padding: 9px 14px 12px; border-top: 1px solid var(--line); }
  button { width: 100%; padding: 6px; font: inherit; color: var(--fg);
           background: transparent; border: 1px solid var(--line);
           border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  #status { margin-top: 8px; color: var(--muted); font-size: 11px; }
  .actions { padding: 11px 14px 12px; border-bottom: 1px solid var(--line); }
  .row2 { display: flex; gap: 7px; margin-top: 7px; }
  .row2 button { flex: 1; }
  button.go { background: var(--accent); border-color: var(--accent);
              color: #fff; font-weight: 600; padding: 8px; }
  button.go:hover { filter: brightness(1.08); color: #fff; }
  .hint { font-weight: 400; opacity: .85; margin-left: 5px; }
  .chord { margin-top: 9px; color: var(--muted); font-size: 11px; text-align: center; }
  .k { display: inline-block; padding: 0 4px; margin: 0 1px;
       border: 1px solid var(--line); border-radius: 4px; font-size: 10px; }
</style>

<header>
  <h1>Chromium Ad Blocker</h1>
  <div class="host" id="host">—</div>
</header>

<div class="actions">
  <button id="deleteAll" class="go">Delete all ads<span class="hint" id="count"></span></button>
  <div class="row2">
    <button id="preview">Show me</button>
    <button id="pick">Pick one</button>
  </div>
  <div class="chord">Or hold <span class="k">Ctrl</span><span class="k">Alt</span> on the page,
    then <span class="k">Delete</span></div>
</div>

<div class="row">
  <label for="enabled">Blocking on
    <span class="sub">Off leaves every page exactly as the site built it</span></label>
  <input type="checkbox" id="enabled">
</div>

<div class="row">
  <label for="mode">Delete automatically
    <span class="sub">Ads go as each page loads, without asking</span></label>
  <input type="checkbox" id="mode">
</div>

<div class="row">
  <label for="ai">Use the model on leftovers
    <span class="sub">Static rules and heuristics always run</span></label>
  <input type="checkbox" id="ai">
</div>

<div class="row">
  <label for="allow">Never block this site
    <span class="sub" id="allowHost">—</span></label>
  <input type="checkbox" id="allow">
</div>

<footer>
  <button id="forget">Re-learn this site</button>
  <div id="status">…</div>
</footer>

<script src="popup.js"></script>
